name: Update ARK Invest ETF data

on:
  # Weekly refresh (every Sunday at 00:00 UTC) plus manual runs.
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continue after the saved ticker cursor; empty or 0 means a full pass over every fund"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts (ark-funds.com uses one conservative lane and the r.jina.ai fallback is paced at >= 3 s; keep >= 1)"
        required: false
        default: "1.5"
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or a nano/micro/small/mid/large preset"
        required: false
        default: ":"
        type: string
      ter:
        description: "Expense ratio range in %: min:max, min:, :max, or :"
        required: false
        default: ":"
        type: string
      concurrency:
        description: "Independent paced lanes for Azure, Yahoo, and SEC requests (keep low)"
        required: false
        default: "2"
        type: string
      holdings_page_size:
        description: "Rows in each generated current-holdings JSON page"
        required: false
        default: "250"
        type: string
      history_page_size:
        description: "Rows in each generated price-history JSON page"
        required: false
        default: "1000"
        type: string
      max_retries:
        description: "Retries after the initial request (default 2)"
        required: false
        default: "2"
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas"
        required: false
        default: ""
        type: string
      category:
        description: "Keep only funds whose category contains this text (case-insensitive)"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Dividend-yield percentage range; colon required"
        required: false
        default: ":"
        type: string
      sec_yield:
        description: "Published 30-day SEC yield percentage range; colon required"
        required: false
        default: ":"
        type: string
      sec_ua:
        description: "Contact-bearing User-Agent for SEC EDGAR requests (empty keeps the repository placeholder)"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "SEC EDGAR Form N-PORT-P fallback for funds whose official holdings CSV is unavailable (default on)"
        required: false
        default: "1"
        type: string
      skip_yahoo:
        description: "Never call the Yahoo chart API, even when the official history is unavailable (true/1)"
        required: false
        default: ""
        type: string
      skip_ark:
        description: "Do not request ark-funds.com; keep the fixed catalog and previously published official data, only run the fallbacks (true/1)"
        required: false
        default: ""
        type: string
      verbose:
        description: "Print per-request retry and fallback notices (true/1)"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "Annualized YTD return range: min:max, min:, :max, or :; colon required"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "Annualized 1Y return range; colon required"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Annualized 3Y return range; colon required"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Annualized 5Y return range; colon required"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "Annualized 10Y return range; colon required"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Cumulative YTD return range; colon required"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Cumulative 1Y return range; colon required"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Cumulative 3Y return range; colon required"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Cumulative 5Y return range; colon required"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "Cumulative 10Y return range; colon required"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      MAX_FETCHES: ${{ inputs.max_fetches || '0' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '1.5' }}
      AUM: ${{ inputs.aum || ':' }}
      TER: ${{ inputs.ter || ':' }}
      CONCURRENCY: ${{ inputs.concurrency || '2' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '250' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '1000' }}
      MAX_RETRIES: ${{ inputs.max_retries || '2' }}
      TICKERS: ${{ inputs.tickers || '' }}
      CATEGORY: ${{ inputs.category || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || ':' }}
      SEC_YIELD: ${{ inputs.sec_yield || ':' }}
      SEC_UA: ${{ inputs.sec_ua || '' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '1' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      SKIP_ARK: ${{ inputs.skip_ark || '' }}
      VERBOSE: ${{ inputs.verbose || '' }}
      PERFORMANCE_YTD: ${{ inputs.performance_ytd || '' }}
      PERFORMANCE_1Y: ${{ inputs.performance_1y || '' }}
      PERFORMANCE_3Y: ${{ inputs.performance_3y || '' }}
      PERFORMANCE_5Y: ${{ inputs.performance_5y || '' }}
      PERFORMANCE_10Y: ${{ inputs.performance_10y || '' }}
      TOTAL_RETURN_YTD: ${{ inputs.total_return_ytd || '' }}
      TOTAL_RETURN_1Y: ${{ inputs.total_return_1y || '' }}
      TOTAL_RETURN_3Y: ${{ inputs.total_return_3y || '' }}
      TOTAL_RETURN_5Y: ${{ inputs.total_return_5y || '' }}
      TOTAL_RETURN_10Y: ${{ inputs.total_return_10y || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run updater unit tests
        run: bun test scripts/update-data.test.ts

      - name: Generate api/ark static data
        run: bun ./scripts/update-data.ts

      - name: Commit updated data
        run: |
          if git diff --quiet -- api/ark; then
            echo "api/ark is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ark
          git commit -m "Update ARK Invest ETF data"
          git push
